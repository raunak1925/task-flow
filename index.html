<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Project Management</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .auth-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .auth-card { background: white; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); padding: 40px; width: 100%; max-width: 400px; }
        .auth-card h2 { margin-bottom: 30px; color: #333; text-align: center; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 5px; color: #555; font-weight: 500; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; }
        .btn { width: 100%; padding: 12px; background: #667eea; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
        .btn:hover { background: #5a67d8; }
        .auth-link { text-align: center; margin-top: 20px; }
        .auth-link a { color: #667eea; text-decoration: none; }
        .dashboard { display: none; }
        .navbar { background: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .nav-brand { font-size: 24px; font-weight: bold; color: #667eea; }
        .nav-user { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .role-badge { padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .role-admin { background: #f56565; color: white; }
        .role-member { background: #48bb78; color: white; }
        .logout-btn { background: #f56565; padding: 8px 20px; width: auto; }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 10px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .stat-card .number { font-size: 32px; font-weight: bold; color: #667eea; margin-top: 10px; }
        .section { background: white; border-radius: 10px; padding: 20px; margin-bottom: 30px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #f0f0f0; flex-wrap: wrap; gap: 10px; }
        .section-header h2 { color: #333; font-size: 20px; }
        .btn-small { width: auto; padding: 8px 15px; font-size: 14px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #f0f0f0; }
        th { background: #f8f9fa; font-weight: 600; }
        .status-todo { background: #fed7d7; color: #c53030; padding: 4px 8px; border-radius: 4px; display: inline-block; font-size: 12px; }
        .status-progress { background: #feebc8; color: #c05621; padding: 4px 8px; border-radius: 4px; display: inline-block; font-size: 12px; }
        .status-done { background: #c6f6d5; color: #276749; padding: 4px 8px; border-radius: 4px; display: inline-block; font-size: 12px; }
        .priority-high { color: #e53e3e; font-weight: bold; }
        .priority-medium { color: #ed8936; }
        .priority-low { color: #48bb78; }
        .icon-btn { padding: 5px 10px; margin: 2px; background: #667eea; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .icon-btn:hover { background: #5a67d8; }
        .icon-btn-danger { background: #f56565; }
        .icon-btn-danger:hover { background: #e53e3e; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 30px; border-radius: 10px; width: 90%; max-width: 450px; max-height: 80vh; overflow-y: auto; }
        .overdue { background-color: #fff5f5; }
        .empty-state { text-align: center; padding: 40px; color: #999; }
        @media (max-width: 768px) { .stats-grid { grid-template-columns: 1fr; } th, td { font-size: 12px; padding: 8px; } .navbar { flex-direction: column; gap: 10px; } .section-header { flex-direction: column; align-items: stretch; } .btn-small { width: 100%; } }
    </style>
</head>
<body>
    <!-- AUTH CONTAINER -->
    <div id="authContainer" class="auth-container">
        <div id="loginForm" class="auth-card">
            <h2>📋 TaskFlow</h2>
            <form id="loginFormElement">
                <div class="form-group"><label>Email</label><input type="email" id="loginEmail" placeholder="admin@admin.com" required></div>
                <div class="form-group"><label>Password</label><input type="password" id="loginPassword" placeholder="••••••" required></div>
                <button type="submit" class="btn">🔐 Login</button>
            </form>
            <div class="auth-link">Don't have an account? <a href="#" onclick="showSignup()">Sign up</a></div>
        </div>
        <div id="signupForm" class="auth-card" style="display:none;">
            <h2>📝 Create Account</h2>
            <form id="signupFormElement">
                <div class="form-group"><label>Full Name</label><input type="text" id="signupName" required></div>
                <div class="form-group"><label>Email</label><input type="email" id="signupEmail" required></div>
                <div class="form-group"><label>Password</label><input type="password" id="signupPassword" required></div>
                <button type="submit" class="btn">✅ Sign Up</button>
            </form>
            <div class="auth-link">Already have an account? <a href="#" onclick="showLogin()">Login</a></div>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="dashboard">
        <nav class="navbar">
            <div class="nav-brand">📋 TaskFlow</div>
            <div class="nav-user">
                <span id="userName"></span>
                <span id="userRole" class="role-badge"></span>
                <button class="btn logout-btn" onclick="logout()">🚪 Logout</button>
            </div>
        </nav>

        <div class="container">
            <!-- STATS -->
            <div class="stats-grid">
                <div class="stat-card"><h3>📁 Total Projects</h3><div class="number" id="totalProjects">0</div></div>
                <div class="stat-card"><h3>✅ Total Tasks</h3><div class="number" id="totalTasks">0</div></div>
                <div class="stat-card"><h3>🎯 Completed Tasks</h3><div class="number" id="completedTasks">0</div></div>
                <div class="stat-card"><h3>⚠️ Overdue Tasks</h3><div class="number" id="overdueTasks">0</div></div>
            </div>

            <!-- PROJECTS SECTION -->
            <div class="section">
                <div class="section-header">
                    <h2>📁 Projects</h2>
                    <button class="btn btn-small" onclick="showCreateProjectModal()" id="createProjectBtn">➕ Create Project</button>
                </div>
                <div id="projectsList"></div>
            </div>

            <!-- TASKS SECTION -->
            <div class="section">
                <div class="section-header">
                    <h2>✅ Tasks</h2>
                    <button class="btn btn-small" onclick="showCreateTaskModal()" id="createTaskBtn">➕ Create Task</button>
                </div>
                <div id="tasksList"></div>
            </div>
        </div>
    </div>

    <!-- PROJECT MODAL -->
    <div id="projectModal" class="modal">
        <div class="modal-content">
            <h2>➕ New Project</h2>
            <form id="projectForm">
                <div class="form-group"><label>Project Name</label><input type="text" id="projectName" required></div>
                <div class="form-group"><label>Description</label><textarea id="projectDesc" rows="3"></textarea></div>
                <button type="submit" class="btn">💾 Create Project</button>
                <button type="button" class="btn" onclick="closeModal('projectModal')" style="background:#ccc; margin-top:10px;">❌ Cancel</button>
            </form>
        </div>
    </div>

    <!-- TASK MODAL -->
    <div id="taskModal" class="modal">
        <div class="modal-content">
            <h2 id="taskModalTitle">➕ New Task</h2>
            <form id="taskForm">
                <div class="form-group"><label>Task Title</label><input type="text" id="taskTitle" required></div>
                <div class="form-group"><label>Description</label><textarea id="taskDesc" rows="2"></textarea></div>
                <div class="form-group"><label>Project</label><select id="taskProjectId" required></select></div>
                <div class="form-group"><label>Assign To</label><select id="taskAssignee"></select></div>
                <div class="form-group"><label>Priority</label><select id="taskPriority"><option value="low">🟢 Low</option><option value="medium">🟡 Medium</option><option value="high">🔴 High</option></select></div>
                <div class="form-group"><label>Status</label><select id="taskStatus"><option value="todo">📋 To Do</option><option value="progress">⚡ In Progress</option><option value="done">✅ Done</option></select></div>
                <div class="form-group"><label>Due Date</label><input type="date" id="taskDueDate" required></div>
                <button type="submit" class="btn">💾 Create Task</button>
                <button type="button" class="btn" onclick="closeModal('taskModal')" style="background:#ccc; margin-top:10px;">❌ Cancel</button>
            </form>
        </div>
    </div>

    <script>
        // ==================== VARIABLES ====================
        let currentUser = null;
        let projects = [];
        let tasks = [];
        let users = [];

        // ==================== HELPER FUNCTION ====================
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // ==================== AUTH FUNCTIONS ====================
        async function login(email, password) {
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();
                if (response.ok) {
                    currentUser = data.user;
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(currentUser));
                    showDashboard();
                    loadData();
                } else {
                    alert(data.error || 'Login failed');
                }
            } catch (error) {
                alert('Error logging in');
            }
        }

        async function signup(name, email, password) {
            try {
                const response = await fetch('/api/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });
                if (response.ok) {
                    alert('✅ Signup successful! Please login.');
                    showLogin();
                } else {
                    const data = await response.json();
                    alert(data.error || 'Signup failed');
                }
            } catch (error) {
                alert('Error signing up');
            }
        }

        // ==================== DATA LOADING ====================
        async function loadData() {
            await Promise.all([loadProjects(), loadTasks(), loadUsers()]);
            updateStats();
            renderProjects();
            renderTasks();
        }

        async function loadProjects() {
            try {
                const response = await fetch('/api/projects', {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });
                if (response.ok) {
                    projects = await response.json();
                }
            } catch (error) {
                console.error('Error loading projects:', error);
            }
        }

        async function loadTasks() {
            try {
                const response = await fetch('/api/tasks', {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });
                if (response.ok) {
                    tasks = await response.json();
                }
            } catch (error) {
                console.error('Error loading tasks:', error);
            }
        }

        async function loadUsers() {
            try {
                const response = await fetch('/api/users', {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });
                if (response.ok) {
                    users = await response.json();
                }
            } catch (error) {
                console.error('Error loading users:', error);
            }
        }

        // ==================== STATS ====================
        function updateStats() {
            document.getElementById('totalProjects').textContent = projects.length;
            document.getElementById('totalTasks').textContent = tasks.length;
            const completed = tasks.filter(t => t.status === 'done').length;
            document.getElementById('completedTasks').textContent = completed;
            const overdue = tasks.filter(t => t.status !== 'done' && t.due_date && new Date(t.due_date) < new Date()).length;
            document.getElementById('overdueTasks').textContent = overdue;
        }

        // ==================== RENDER PROJECTS ====================
        function renderProjects() {
            const container = document.getElementById('projectsList');
            
            if (!projects || projects.length === 0) {
                container.innerHTML = '<div class="empty-state">📁 No projects yet. Click "Create Project" to start!</div>';
                return;
            }

            // Admin can see all projects and delete them
            // Member can only see projects (no delete button)
            const isAdmin = (currentUser && currentUser.role === 'admin');
            
            let html = `<table><thead><tr><th>Project Name</th><th>Description</th><th>Tasks</th><th>Actions</th></tr></thead><tbody>`;
            
            projects.forEach(project => {
                const taskCount = tasks.filter(t => t.project_id === project.id).length;
                let actions = '-';
                if (isAdmin) {
                    actions = `<button class="icon-btn icon-btn-danger" onclick="deleteProject(${project.id})">🗑️ Delete</button>`;
                }
                
                html += `<tr>
                    <td><strong>${escapeHtml(project.name)}</strong></td>
                    <td>${escapeHtml(project.description || '-')}</td>
                    <td>${taskCount} tasks</td>
                    <td>${actions}</td>
                </tr>`;
            });
            
            html += `</tbody>}</div>`;
            container.innerHTML = html;
        }

        // ==================== RENDER TASKS ====================
        function renderTasks() {
            const container = document.getElementById('tasksList');
            
            if (!tasks || tasks.length === 0) {
                container.innerHTML = '<div class="empty-state">✅ No tasks yet. Click "Create Task" to start!</div>';
                return;
            }

            const isAdmin = (currentUser && currentUser.role === 'admin');
            
            // Filter tasks: Admin sees all, Member sees only assigned tasks
            let filteredTasks = tasks;
            if (!isAdmin) {
                filteredTasks = tasks.filter(t => t.assignee_id === currentUser.id);
            }
            
            if (filteredTasks.length === 0) {
                container.innerHTML = '<div class="empty-state">📋 No tasks assigned to you yet!</div>';
                return;
            }

            let html = `<table><thead><tr>
                <th>Title</th><th>Project</th><th>Assigned To</th><th>Priority</th><th>Status</th><th>Due Date</th><th>Actions</th>
            </tr></thead><tbody>`;
            
            filteredTasks.forEach(task => {
                const project = projects.find(p => p.id === task.project_id);
                const assignee = users.find(u => u.id === task.assignee_id);
                const isOverdue = task.status !== 'done' && task.due_date && new Date(task.due_date) < new Date();
                const rowClass = isOverdue ? 'overdue' : '';
                
                // Role-based actions:
                // - Admin: Can edit (Edit) and delete (Delete) any task
                // - Member: Can only edit assigned tasks (status update only), cannot delete
                const canEdit = (isAdmin || task.assignee_id === currentUser.id);
                const canDelete = isAdmin;
                
                let actions = '';
                if (canEdit) {
                    actions += `<button class="icon-btn" onclick="editTask(${task.id})">✏️ Edit</button>`;
                }
                if (canDelete) {
                    actions += `<button class="icon-btn icon-btn-danger" onclick="deleteTask(${task.id})">🗑️ Delete</button>`;
                }
                if (!canEdit && !canDelete) {
                    actions = '-';
                }
                
                html += `<tr class="${rowClass}">
                    <td><strong>${escapeHtml(task.title)}</strong><br><small>${escapeHtml(task.description || '')}</small></td>
                    <td>${project ? escapeHtml(project.name) : '-'}</td>
                    <td>${assignee ? escapeHtml(assignee.name) : 'Unassigned'}</td>
                    <td class="priority-${task.priority || 'medium'}">${task.priority || 'medium'}</td>
                    <td>
                        <select onchange="updateTaskStatus(${task.id}, this.value)" style="padding:4px 8px;border-radius:4px;">
                            <option value="todo" ${task.status === 'todo' ? 'selected' : ''}>📋 To Do</option>
                            <option value="progress" ${task.status === 'progress' ? 'selected' : ''}>⚡ In Progress</option>
                            <option value="done" ${task.status === 'done' ? 'selected' : ''}>✅ Done</option>
                        </select>
                    </td>
                    <td>${task.due_date ? new Date(task.due_date).toLocaleDateString() : '-'}</td>
                    <td>${actions}</td>
                </tr>`;
            });
            
            html += `</tbody>}</div>`;
            container.innerHTML = html;
        }

        // ==================== CREATE / DELETE PROJECT ====================
        async function createProject(name, description) {
            // Only admin can create projects
            if (currentUser.role !== 'admin') {
                alert('❌ Only Admin can create projects!');
                return;
            }
            
            try {
                const response = await fetch('/api/projects', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify({ name, description: description || '' })
                });
                
                if (response.ok) {
                    await loadData();
                    closeModal('projectModal');
                    document.getElementById('projectForm').reset();
                } else {
                    const data = await response.json();
                    alert(data.error || 'Failed to create project');
                }
            } catch (error) {
                alert('Error creating project');
            }
        }

        async function deleteProject(id) {
            // Only admin can delete projects
            if (currentUser.role !== 'admin') {
                alert('❌ Only Admin can delete projects!');
                return;
            }
            
            if (confirm('⚠️ Delete this project? All tasks inside will also be deleted!')) {
                try {
                    const response = await fetch(`/api/projects/${id}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                    });
                    if (response.ok) {
                        await loadData();
                    } else {
                        alert('Failed to delete project');
                    }
                } catch (error) {
                    alert('Error deleting project');
                }
            }
        }

        // ==================== CREATE / UPDATE / DELETE TASK ====================
        async function createTask() {
            // Only admin can create tasks
            if (currentUser.role !== 'admin') {
                alert('❌ Only Admin can create tasks!');
                closeModal('taskModal');
                return;
            }
            
            const projectId = document.getElementById('taskProjectId').value;
            const assigneeId = document.getElementById('taskAssignee').value;
            
            if (!projectId) {
                alert('Please select a project');
                return;
            }
            
            const taskData = {
                title: document.getElementById('taskTitle').value,
                description: document.getElementById('taskDesc').value,
                projectId: parseInt(projectId),
                assigneeId: assigneeId ? parseInt(assigneeId) : null,
                priority: document.getElementById('taskPriority').value,
                status: document.getElementById('taskStatus').value,
                dueDate: document.getElementById('taskDueDate').value
            };
            
            try {
                const response = await fetch('/api/tasks', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify(taskData)
                });
                
                if (response.ok) {
                    await loadData();
                    closeModal('taskModal');
                    document.getElementById('taskForm').reset();
                    alert('✅ Task created successfully!');
                } else {
                    const data = await response.json();
                    alert(data.error || 'Failed to create task');
                }
            } catch (error) {
                alert('Error creating task');
            }
        }

        async function updateTaskStatus(id, status) {
            // Both Admin and Member can update status of tasks they can see
            // Member can only update assigned tasks (filtered in render)
            try {
                const response = await fetch(`/api/tasks/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify({ status })
                });
                if (response.ok) {
                    await loadData();
                } else {
                    alert('Failed to update task status');
                }
            } catch (error) {
                alert('Error updating task');
            }
        }

        async function deleteTask(id) {
            // Only admin can delete tasks
            if (currentUser.role !== 'admin') {
                alert('❌ Only Admin can delete tasks!');
                return;
            }
            
            if (confirm('⚠️ Delete this task?')) {
                try {
                    const response = await fetch(`/api/tasks/${id}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                    });
                    if (response.ok) {
                        await loadData();
                    } else {
                        alert('Failed to delete task');
                    }
                } catch (error) {
                    alert('Error deleting task');
                }
            }
        }

        // ==================== EDIT TASK ====================
        function editTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                document.getElementById('taskModalTitle').innerHTML = '✏️ Edit Task';
                document.getElementById('taskId').value = task.id;
                document.getElementById('taskTitle').value = task.title;
                document.getElementById('taskDesc').value = task.description || '';
                document.getElementById('taskProjectId').value = task.project_id;
                document.getElementById('taskAssignee').value = task.assignee_id || '';
                document.getElementById('taskPriority').value = task.priority || 'medium';
                document.getElementById('taskStatus').value = task.status;
                document.getElementById('taskDueDate').value = task.due_date || '';
                
                // Populate dropdowns
                const projectSelect = document.getElementById('taskProjectId');
                projectSelect.innerHTML = '<option value="">Select Project</option>';
                projects.forEach(p => {
                    projectSelect.innerHTML += `<option value="${p.id}" ${p.id === task.project_id ? 'selected' : ''}>${p.name}</option>`;
                });
                
                const assigneeSelect = document.getElementById('taskAssignee');
                assigneeSelect.innerHTML = '<option value="">Select Assignee</option>';
                users.forEach(u => {
                    assigneeSelect.innerHTML += `<option value="${u.id}" ${u.id === task.assignee_id ? 'selected' : ''}>${u.name}</option>`;
                });
                
                // Change form submit behavior for edit
                const taskForm = document.getElementById('taskForm');
                taskForm.onsubmit = (e) => {
                    e.preventDefault();
                    updateTask(task.id);
                };
                
                document.getElementById('taskModal').style.display = 'flex';
            }
        }

        async function updateTask(id) {
            const taskData = {
                title: document.getElementById('taskTitle').value,
                description: document.getElementById('taskDesc').value,
                projectId: parseInt(document.getElementById('taskProjectId').value),
                assigneeId: document.getElementById('taskAssignee').value ? parseInt(document.getElementById('taskAssignee').value) : null,
                priority: document.getElementById('taskPriority').value,
                status: document.getElementById('taskStatus').value,
                dueDate: document.getElementById('taskDueDate').value
            };
            
            try {
                const response = await fetch(`/api/tasks/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify(taskData)
                });
                
                if (response.ok) {
                    await loadData();
                    closeModal('taskModal');
                    document.getElementById('taskForm').reset();
                    // Reset form submit handler
                    document.getElementById('taskForm').onsubmit = (e) => { e.preventDefault(); createTask(); };
                    alert('✅ Task updated successfully!');
                } else {
                    alert('Failed to update task');
                }
            } catch (error) {
                alert('Error updating task');
            }
        }

        // ==================== UI FUNCTIONS ====================
        function showDashboard() {
            document.getElementById('authContainer').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('userName').innerHTML = currentUser.name;
            
            const roleBadge = document.getElementById('userRole');
            roleBadge.innerHTML = currentUser.role === 'admin' ? '👑 ADMIN' : '👤 MEMBER';
            roleBadge.className = `role-badge role-${currentUser.role}`;
            
            // Role-based button visibility
            const isAdmin = (currentUser.role === 'admin');
            
            // Create Project button - Admin only
            const createProjectBtn = document.getElementById('createProjectBtn');
            if (createProjectBtn) {
                createProjectBtn.style.display = isAdmin ? 'inline-block' : 'none';
            }
            
            // Create Task button - Admin only
            const createTaskBtn = document.getElementById('createTaskBtn');
            if (createTaskBtn) {
                createTaskBtn.style.display = isAdmin ? 'inline-block' : 'none';
            }
        }

        function showCreateProjectModal() {
            if (currentUser.role !== 'admin') {
                alert('❌ Only Admin can create projects!');
                return;
            }
            document.getElementById('projectModal').style.display = 'flex';
            document.getElementById('projectForm').reset();
        }

        function showCreateTaskModal() {
            if (currentUser.role !== 'admin') {
                alert('❌ Only Admin can create tasks!');
                return;
            }
            
            document.getElementById('taskForm').reset();
            document.getElementById('taskModalTitle').innerHTML = '➕ New Task';
            
            // Reset form submit handler
            document.getElementById('taskForm').onsubmit = (e) => {
                e.preventDefault();
                createTask();
            };
            
            const projectSelect = document.getElementById('taskProjectId');
            projectSelect.innerHTML = '<option value="">Select Project</option>';
            projects.forEach(p => {
                projectSelect.innerHTML += `<option value="${p.id}">${escapeHtml(p.name)}</option>`;
            });
            
            const assigneeSelect = document.getElementById('taskAssignee');
            assigneeSelect.innerHTML = '<option value="">Select Assignee</option>';
            users.forEach(u => {
                assigneeSelect.innerHTML += `<option value="${u.id}">${escapeHtml(u.name)} (${u.role})</option>`;
            });
            
            document.getElementById('taskModal').style.display = 'flex';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        function logout() {
            localStorage.clear();
            currentUser = null;
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('authContainer').style.display = 'flex';
            showLogin();
        }

        function showLogin() {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('signupForm').style.display = 'none';
        }

        function showSignup() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('signupForm').style.display = 'block';
        }

        // ==================== EVENT LISTENERS ====================
        document.getElementById('loginFormElement').addEventListener('submit', (e) => {
            e.preventDefault();
            login(document.getElementById('loginEmail').value, document.getElementById('loginPassword').value);
        });

        document.getElementById('signupFormElement').addEventListener('submit', (e) => {
            e.preventDefault();
            signup(document.getElementById('signupName').value, document.getElementById('signupEmail').value, document.getElementById('signupPassword').value);
        });

        document.getElementById('projectForm').addEventListener('submit', (e) => {
            e.preventDefault();
            createProject(document.getElementById('projectName').value, document.getElementById('projectDesc').value);
        });

        document.getElementById('taskForm').addEventListener('submit', (e) => {
            e.preventDefault();
            createTask();
        });

        // ==================== CHECK EXISTING SESSION ====================
        const token = localStorage.getItem('token');
        const savedUser = localStorage.getItem('user');
        if (token && savedUser) {
            currentUser = JSON.parse(savedUser);
            showDashboard();
            loadData();
        } else {
            showLogin();
        }
    </script>
</body>
</html>
